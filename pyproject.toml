[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pydx12"
version = "0.2.0"
description = "Pure ctypes bindings for DirectX 12 (D3D12 + DX12 Ultimate, DXGI, DXC, DirectML, XAudio2, XInput)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Roberto De Ioris", email = "roberto.deioris@gmail.com" }]
requires-python = ">=3.9"
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]

[project.urls]
Homepage = "https://github.com/rdeioris/pydx12"

[project.optional-dependencies]
test = ["pytest", "numpy"]

[tool.setuptools]
packages = ["pydx12"]

# the bundled DXC DLLs are x64: build with  python -m build -C--build-option=--plat-name=win_amd64

[tool.setuptools.package-data]
pydx12 = ["dxcompiler.dll", "dxil.dll"]

[tool.pytest.ini_options]
testpaths = ["tests"]
